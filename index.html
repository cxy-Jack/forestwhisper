<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="林影心语 —— 情绪永不孤独" />
    <title>林影心语 · 守护你的情绪</title>
    <script>
      (function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('lyxy:theme')
          if (saved === 'dark' || saved === 'light') {
            theme = saved
          }
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
